syntax = "proto3";

package Axlebolt.Bolt.Protobuf2;
enum Comparison {
    EQUAL_TO_OR_LESS_THAN = 0;
    LESS_THAN = 1;
    EQUAL = 2;
    GREATER_THAN = 3;
    EQUAL_TO_OR_GREATER_THAN = 4;
    NOT_EQUAL = 5;
}
enum Platform {
Unknown = 0;
Android = 1;
IOS = 2;
}

message Filter {
    string name = 1;
    int32 intValue = 2;
    float floatValue = 3;
    string stringValue = 4;
    Comparison comparison = 5;
}

message AvatarBinary {
    string id = 1;
    bytes avatar = 2;
}

message UserConfigBinary {
    bytes config = 1;
}

message Dictionary {
    map<string,string> content = 1;
}
message GameServer {
    string id = 1;
    string ip = 2;
    int32 port = 3;
}
message PhotonGame {
    string region = 1;
    string roomId = 2;
    string appVersion = 3;
    map<string,string> customProperties = 4;
}
message DateRange
{
	int64 from = 1;
	int64 to = 2;
}
message DayRange
{
	int32 from = 1;
	int32 to = 2;
}
message LocalizedTitle
{
	string name = 1;
	string description = 2;
}