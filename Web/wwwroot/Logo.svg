<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 72" role="img" aria-label="StandRework">
  <defs>
    <linearGradient id="gStand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#d8d8dc"/>
      <stop offset="100%" stop-color="#9a9aa3"/>
    </linearGradient>
    <linearGradient id="gRework" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6ec7"/>
      <stop offset="100%" stop-color="#c026d3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <text x="260" y="54" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="52" font-weight="900" letter-spacing="1" filter="url(#shadow)">
    <tspan fill="url(#gStand)">STAND</tspan><tspan fill="url(#gRework)">REWORK</tspan>
  </text>
</svg>
